<!DOCTYPE html>
<html>
<head>
    <title>Test JavaScript - Controllers</title>
</head>
<body>
    <h1>Test de Controllers</h1>
    <div id="result"></div>
    
    <script>
        async function testController() {
            try {
                console.log('Iniciando test...');
                
                // Test 1: Acción listar
                const response1 = await fetch('controller/caja_ingresos_controller.php?accion=listar');
                console.log('Response 1 status:', response1.status);
                const result1 = await response1.json();
                console.log('Result 1:', result1);
                
                // Test 2: Acción total_recibido
                const formData = new FormData();
                formData.append('accion', 'total_recibido');
                
                const response2 = await fetch('controller/caja_ingresos_controller.php', {
                    method: 'POST',
                    body: formData
                });
                console.log('Response 2 status:', response2.status);
                const result2 = await response2.json();
                console.log('Result 2:', result2);
                
                document.getElementById('result').innerHTML = `
                    <h3>Resultados:</h3>
                    <p><strong>Test 1 (listar):</strong> ${result1.success ? 'ÉXITO' : 'ERROR'} - ${result1.data?.length || 0} registros</p>
                    <p><strong>Test 2 (total_recibido):</strong> ${result2.success ? 'ÉXITO' : 'ERROR'} - Total: $${result2.total || 0}</p>
                `;
                
            } catch (error) {
                console.error('Error en test:', error);
                document.getElementById('result').innerHTML = `<p style="color: red;">ERROR: ${error.message}</p>`;
            }
        }
        
        // Ejecutar test al cargar la página
        window.onload = testController;
    </script>
</body>
</html>
